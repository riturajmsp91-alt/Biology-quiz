<!doctype html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Class 12 Biology Revision Quiz</title>
    <!-- CSS फाइल को लिंक किया गया है -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📚 Class 12 Biology Revision Quiz</h1>
        <div id="progress">प्रश्न 1 / 100</div>
    </header>
    <div class="container">
        <div class="home">सही विकल्प पर क्लिक करने पर <b>हरा</b> और गलत विकल्प पर <b>लाल</b> रंग दिखेगा। एक प्रश्न का उत्तर देने के बाद विकल्प लॉक हो जाएगा।</div>
        <div id="quiz"></div>
        <div id="result" class="card">
            <div>🎉 Revision पूरा!</div>
            <div class="score" id="score"></div>
            <div id="percent"></div>
            <button class="finish" onclick="restart()">फिर से शुरू करें</button>
        </div>
    </div>

    <!-- JavaScript फाइल को लिंक किया गया है -->
    <script src="script.js"></script>
</body>
</html>
